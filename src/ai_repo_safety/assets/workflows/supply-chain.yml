name: supply-chain

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  osv:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        scan
        source
        -r
        --allow-no-lockfiles
        ./

  python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Lockfile audit
        run: |
          python -m pip install --upgrade pip pip-audit "msgpack>=1.2.1"
          if [ -f uv.lock ]; then
            uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/reqs.txt"
            pip-audit -r "$RUNNER_TEMP/reqs.txt" --disable-pip
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --disable-pip || pip-audit -r requirements.txt
          else
            echo "No uv.lock or requirements.txt; skipping lockfile audit"
          fi
